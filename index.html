<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet" />

    <script type="module" src="/src/main.ts"></script>
    <title>cpg-exhibition</title>
  </head>
  <body>
    <header class="main-layout">
      <img src="/src/assets/svg/cpg-logo.svg" id="cpg-logo"/>
      <!-- header hidden in portrait mode -->
      <h1 class="cooper" id="title">2026&nbsp;Publishers&nbsp;Fair</h1>
    </header>

    <section id="map-container">
      <section id="click-map">
        <img usemap="#cpg" src="/src/assets/svg/Map-nohead.svg" id="map"/>
        <!--
          ex. button
          <button id="interactive-4" class="interactive">

            popup goes inside:
            <article class="info-box">
              ...
            </article>

          </button>
        -->
      </section>
    </section>

    <template id="info-box-template">
      <article class="info-box">
        <h1 class="vendor-name">name</h1>
        <h2 class="vendor-handle">handle</h2>
        <p class="vendor-description">desc</p>
        <div class="triangle"></div>
        <!-- triangle generator: https://www.cssportal.com/css-triangle-generator/ -->
      </article>
    </template>
  </body>
</html>
